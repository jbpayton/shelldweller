<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4ade80"/>
    </marker>
    <marker id="arrdim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8fa898"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="#0b0f0d"/>

  <!-- title -->
  <text x="60" y="98" font-size="54" font-weight="bold">
    <tspan fill="#4ade80">$</tspan><tspan x="112" fill="#e9e7e2">shelldweller</tspan>
  </text>
  <text x="62" y="138" font-size="20" fill="#22c55e">the LLM is a Unix device.</text>
  <text x="62" y="164" font-size="20" fill="#22c55e">the agent dwells in the shell.</text>

  <line x1="60" y1="192" x2="700" y2="192" stroke="#2c4534" stroke-width="1"/>

  <!-- contract flow -->
  <rect x="60" y="225" width="90" height="54" rx="6" fill="#111713" stroke="#2c4534"/>
  <text x="105" y="257" font-size="15" fill="#e9e7e2" text-anchor="middle">task</text>

  <line x1="150" y1="252" x2="176" y2="252" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="180" y="215" width="190" height="74" rx="6" fill="#111713" stroke="#2c4534"/>
  <text x="275" y="245" font-size="15" fill="#e9e7e2" text-anchor="middle">bridle</text>
  <text x="275" y="268" font-size="13" fill="#8fa898" text-anchor="middle">extracts ``` fences</text>

  <line x1="370" y1="252" x2="396" y2="252" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="400" y="215" width="170" height="74" rx="6" fill="#111713" stroke="#2c4534"/>
  <text x="485" y="245" font-size="15" fill="#e9e7e2" text-anchor="middle">llm device</text>
  <text x="485" y="268" font-size="13" fill="#8fa898" text-anchor="middle">text in, text out</text>

  <line x1="275" y1="289" x2="275" y2="326" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="180" y="330" width="250" height="54" rx="6" fill="#111713" stroke="#2c4534"/>
  <text x="305" y="362" font-size="14" fill="#e9e7e2" text-anchor="middle">bash runs the fenced script</text>

  <path d="M430 357 C 520 357, 487 330, 486 295" fill="none" stroke="#8fa898" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrdim)"/>
  <text x="508" y="345" font-size="12" fill="#8fa898">non-zero exit?</text>
  <text x="508" y="361" font-size="12" fill="#8fa898">failure fed back</text>

  <text x="60" y="416" font-size="13" fill="#8fa898">a handful of small scripts — the model reads its own source</text>

  <line x1="60" y1="436" x2="700" y2="436" stroke="#2c4534" stroke-width="1"/>

  <!-- phase 3: homestead -->
  <text x="60" y="462" font-size="13" fill="#fbbf24" letter-spacing="3">PHASE 3 · HOMESTEAD</text>

  <rect x="60" y="474" width="96" height="38" rx="6" fill="#111713" stroke="#2c4534"/>
  <text x="108" y="498" font-size="13" fill="#e9e7e2" text-anchor="middle">tick n</text>
  <line x1="156" y1="493" x2="182" y2="493" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="186" y="474" width="96" height="38" rx="6" fill="#111713" stroke="#2c4534"/>
  <text x="234" y="498" font-size="13" fill="#e9e7e2" text-anchor="middle">tick n+1</text>
  <line x1="282" y1="493" x2="308" y2="493" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="312" y="474" width="96" height="38" rx="6" fill="#111713" stroke="#2c4534"/>
  <text x="360" y="498" font-size="13" fill="#e9e7e2" text-anchor="middle">tick n+2</text>
  <text x="428" y="499" font-size="15" fill="#8fa898">…</text>

  <rect x="470" y="474" width="150" height="38" rx="6" fill="#111713" stroke="#5a4a1e"/>
  <text x="545" y="498" font-size="13" fill="#fbbf24" text-anchor="middle">.meter 19431 tk</text>

  <line x1="108" y1="512" x2="108" y2="536" stroke="#8fa898" stroke-width="1" marker-end="url(#arrdim)"/>
  <line x1="234" y1="512" x2="234" y2="536" stroke="#8fa898" stroke-width="1" marker-end="url(#arrdim)"/>
  <line x1="360" y1="512" x2="360" y2="536" stroke="#8fa898" stroke-width="1" marker-end="url(#arrdim)"/>

  <rect x="60" y="540" width="560" height="44" rx="6" fill="#111713" stroke="#22c55e"/>
  <text x="340" y="561" font-size="14" fill="#4ade80" text-anchor="middle">/home/dweller — persists</text>
  <text x="340" y="578" font-size="12" fill="#8fa898" text-anchor="middle">the dweller rewrites its own machinery</text>

  <!-- shell spiral -->
  <path d="M1060 380 A144 144 0 0 0 916 236 A89 89 0 0 0 827 325 A55 55 0 0 0 882 380 A34 34 0 0 0 916 346 A21 21 0 0 0 895 325 A13 13 0 0 0 882 338 A8 8 0 0 0 890 346"
        fill="none" stroke="#4ade80" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  <rect x="886" y="339" width="7" height="12" fill="#4ade80"/>

  <!-- heartbeat trace -->
  <polyline points="790,470 880,470 900,470 912,442 928,492 940,458 952,470 1110,470"
            fill="none" stroke="#fbbf24" stroke-width="2" stroke-linejoin="round" opacity="0.85"/>
  <text x="950" y="508" font-size="12" fill="#8fa898" text-anchor="middle">the heartbeat · one tick at a time</text>

  <!-- badges -->
  <text x="600" y="614" font-size="15" fill="#8fa898" text-anchor="middle">pure shell · no framework · fences are the contract · metered inference · persistent home · self-rewriting</text>
</svg>
