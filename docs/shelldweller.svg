<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 1200 630" font-family="'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace">
  <rect width="1200" height="630" fill="#0b0f0d"/>

  <!-- title -->
  <text x="60" y="72" fill="#e6efe9" font-size="34" font-weight="700">shelldweller</text>
  <text x="60" y="112" fill="#4ade80" font-size="26">the harness is not the moat.</text>
  <text x="60" y="146" fill="#8fa898" font-size="17">same 27B model · same rules · same seeds · same substrate · one variable</text>

  <!-- panel frames -->
  <rect x="60" y="176" width="520" height="390" rx="10" fill="#101713" fill-opacity="0.5" stroke="#243029" stroke-width="1.5"/>
  <rect x="620" y="176" width="520" height="390" rx="10" fill="#101713" fill-opacity="0.5" stroke="#2f6b45" stroke-width="1.5"/>

  <!-- panel headers -->
  <text x="88" y="214" fill="#8fa898" font-size="20" font-weight="700">trial 5</text>
  <text x="648" y="214" fill="#4ade80" font-size="20" font-weight="700">trial 6</text>

  <!-- identical lines, both panels -->
  <g fill="#8fa898" font-size="16">
    <text x="88" y="252">model      qwen3.8-27b · 32k · one GPU</text>
    <text x="88" y="278">rules      identical</text>
    <text x="88" y="304">seeds      LEARN · REMEMBER · PERSIST</text>
    <text x="88" y="330">substrate  git · meter · boot · door</text>
    <text x="648" y="252">model      qwen3.8-27b · 32k · one GPU</text>
    <text x="648" y="278">rules      identical</text>
    <text x="648" y="304">seeds      LEARN · REMEMBER · PERSIST</text>
    <text x="648" y="330">substrate  git · meter · boot · door</text>
  </g>

  <!-- the one variable -->
  <text x="88" y="368" fill="#e6efe9" font-size="16">queue      01–20 the basics</text>
  <text x="88" y="392" fill="#e6efe9" font-size="16">           21–26 the world</text>
  <text x="648" y="368" fill="#e6efe9" font-size="16">queue      01–05 the world</text>
  <text x="648" y="392" fill="#e6efe9" font-size="16">           06–25 the basics</text>

  <!-- divider -->
  <line x1="88" y1="416" x2="552" y2="416" stroke="#243029" stroke-width="1"/>
  <line x1="648" y1="416" x2="1112" y2="416" stroke="#2f6b45" stroke-width="1"/>

  <!-- outcomes -->
  <g fill="#8fa898" font-size="16">
    <text x="88" y="452">71 turns</text>
    <text x="88" y="480">cases 01–07 done, in order</text>
    <text x="88" y="508" fill="#c9a24a">0 outward acts</text>
    <text x="88" y="536">never reached the world</text>
  </g>
  <g fill="#4ade80" font-size="16">
    <text x="648" y="452">turn 4    builds a search tool, cites sources</text>
    <text x="648" y="480">hour 1    two answers, fetched, verified</text>
    <text x="648" y="508">hour 2    a memory tier from a fetched paper</text>
    <text x="648" y="536">day 1     all five world cases passed, verified</text>
  </g>

  <!-- footer -->
  <text x="60" y="596" fill="#8fa898" font-size="15">the model brings the control structure. the environment has to bring the economy and the truth.</text>
  <text x="60" y="618" fill="#8fa898" font-size="15">the operator's instrument is the queue.</text>
</svg>
